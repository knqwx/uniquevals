<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MM2 Aggregator</title>
    <style>
        body {
            background-color: #1a1a1a; /* Более темный фон */
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
        }
        /* Сайдбар слева */
        aside {
            width: 220px;
            background-color: #141414;
            border-right: 1px solid #2c2c2c;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }
        .sidebar-title {
            font-size: 16px;
            font-weight: bold;
            color: #888;
            margin-bottom: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .sidebar-item {
            color: #ccc;
            text-decoration: none;
            padding: 10px 0;
            transition: color 0.2s;
        }
        .sidebar-item:hover {
            color: #fff;
        }
        /* Основная область */
        main {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: 40px; /* Текст вверху */
        }
        h1 {
            font-size: 24px;
            margin: 0;
            text-transform: lowercase;
        }
    </style>
</head>
<body>

    <aside>
        <div class="sidebar-title">Menu</div>
        <a href="#" class="sidebar-item">Values</a>
        <a href="#" class="sidebar-item">Compare</a>
        <a href="#" class="sidebar-item">Settings</a>
    </aside>

    <main>
        <h1>unique values</h1>
    </main>

</body>
</html>
