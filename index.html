<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Unique Values</title>
    <style>
        body { 
            background: #1a1a1a; 
            color: #fff; 
            font-family: Arial, sans-serif; 
            margin: 0; 
            display: flex; 
            height: 100vh; 
            overflow: hidden; 
            justify-content: center;
            align-items: center;
        }

        .main-card {
            width: 800px;
            height: 500px;
            background: #222;
            border: 1px solid #333;
            border-radius: 12px;
            padding: 40px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .item-name {
            font-size: 36px;
            font-weight: bold;
            color: #fff;
        }

        .item-value-container {
            font-size: 24px;
            color: #aaa;
        }

        .item-value {
            color: #4CAF50;
            font-weight: bold;
        }

        .loading {
            color: #888;
            font-style: italic;
        }
    </style>
</head>
<body>
    <div class="main-card">
        <div class="item-name">Gingerscope</div>
        <div class="item-value-container">
            Value: <span id="supreme-value" class="item-value loading">Fetching from Supreme Values...</span>
        </div>
    </div>

    <script>
        async function fetchRealValue() {
            const valueSpan = document.getElementById('supreme-value');
            const targetUrl = 'https://supremevalues.com/'; 
            const proxyUrl = 'https://api.allorigins.win/get?url=' + encodeURIComponent(targetUrl);

            try {
                const response = await fetch(https://uniquevals-api.onrender.com/api/values);
                const data = await response.json();
                
                if (data.contents) {
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(data.contents, 'text/html');
                    
                    // Ищем элемент по классу, который ты нашел на скриншоте
                    const priceElement = doc.querySelector('.itemvalue.val-top'); 
                    
                    if (priceElement) {
                        valueSpan.textContent = priceElement.textContent;
                        valueSpan.classList.remove('loading');
                    } else {
                        valueSpan.textContent = "Price tag not found";
                    }
                } else {
                    throw new Error('No data');
                }
            } catch (error) {
                valueSpan.textContent = "Failed to fetch";
                valueSpan.style.color = "#f44336";
                console.error(error);
            }
        }

        fetchRealValue();
    </script>
</body>
</html>
